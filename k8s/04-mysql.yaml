apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: stockflow
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
     - port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: stockflow
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: senhas
              key: DB_PASSWORD
        volumeMounts:
        - name: dados-mysql
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: dados-mysql
    spec:
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
