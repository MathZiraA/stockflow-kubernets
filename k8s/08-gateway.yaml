apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: stockflow
spec:
  selector:
    app: gateway
  ports:
    - port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: stockflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: leonardosartorello/java-gateway-k8s:v1
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: dados
